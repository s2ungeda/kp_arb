# kp-arb 취급 종목 설정 (DESIGN.md §11). 비밀값 아님 — git으로 이력 관리.
# - stock: 국내 주식 종목코드 (도메인 enum과 일치해야 함 — 불일치 시 시동 에러)
# - etf:   단일종목 레버리지 ETF (없으면 생략 — 해당 underlying은 ETF 미취급)
# - hl:    Hyperliquid 빌더 perp 심볼 (dex 접두 포함)
# 주식선물은 월물(만기 있음)이라 여기 적지 않고 시동 시 LS 마스터(t8401)에서 자동 조회.
# ETF는 취급 제외 (사용자 확정 2026-07-13 — 주식·주식선물만. 복귀 시 etf: 줄만 살리면 됨)
symbols:
  samsung:
    stock: "005930"
    # etf: "0193W0"    # KODEX 삼성전자단일종목 (2x) — 미취급
    hl: "xyz:SMSN"
  sk_hynix:
    stock: "000660"
    # etf: "0193T0"    # KODEX SK하이닉스단일 (2x) — 미취급
    hl: "xyz:SKHX"
  hyundai:
    stock: "005380"
    hl: "xyz:HYUNDAI"

# ETF 명목 계산 승수 (외부 #2 노출 보고용, DESIGN §5.7)
etf_leverage: 2.0

# 캐리 이론가 연이자율 초기 기본값 — 실사용은 공통설정(GlobalSettings)이 덮어씀(사용자 입력)
carry_rates:
  # [주의] 실제 사용값은 **설정창(전체 공통설정)의 이자율**이다 — core_state.json에 저장되어
  # 코어 시동 시 이 값을 덮어쓴다(core_server.make_app). 아래는 설정 저장값이 없을 때의 초기값.
  # 엑셀(시세!O2 외환금리차)은 0.4% — 설정창에서 맞출 것(2026-09-03 대조).
  stock_futures: 0.030   # 주식선물 이론가 = 기초 현재가 × (1 + r × 잔존일/365)  기본 3.0%
  fx: 0.010              # 환율이론가 = 원달러선물 × (1 + r × 잔존일/365)  기본 1.0%

# 외환선물 우선시간 — 이 시간대 안은 원달러선물 역산현물가만, 밖은 LS 현물환 → 역산현물가
# (DESIGN-auto-m-exec.md 결정 47, 2026-09-28). [주의] 실제 사용값은 **설정창(전체 공통설정)의
# "외환선물 우선시간"**이다(core_state.json 저장·시동 시 덮어씀). 아래는 설정 저장값이 없을 때의 초기값.
fx_fut_window:
  start: "08:45:00"      # 통화선물 주간장
  end: "15:45:00"

# 왕복 수수료·세금 (명목 대비 비율 — 순진입 계산용. 엑셀 fee 셀(편도)×2 기준, 조정 예정)
fees:
  stock: 0.0007          # HL+주식 쌍: (0.02% + 0.015%) × 2 — 거래세 포함 여부 확인 필요
  stock_future: 0.00042  # HL+주식선물 쌍: (0.006% + 0.015%) × 2

# 괴리 보드 — 진입/청산 신호는 발주 수량 기준 est-price 괴리 (DESIGN §6.1-2)
disparity:
  ref_qty: 1             # CSV 분포 기록 기준 국내 수량(주식=주/선물=계약). 화면은 입력 수량 사용

# HL 주문 전송 통로 (DESIGN-hl-ws-post.md, 사용자 2026-11-11): true = 웹소켓(미접속이면 그 요청만 HTTP),
# false = 옛 HTTP만. 개장 첫 주문의 "식은 연결 새로 맺기 ~300ms"를 없애는 용도.
hl_ws_post: true

# 시장 시간표 (DESIGN-market-hours.md, 사용자 2026-11-10 "하드코딩 시각 → config").
# 코드가 쓰던 시각 상수(환율 계산 시작·원달러선물 예비 조회 시간대·월물 롤오버 시각)의 출처.
# 거래 가능 판정은 여전히 LS 장운영정보(JIF)이고, 화면에 넣은 시각(체결쏴 구간·동시호가 주문시각·
# 외환선물 우선시간·NXT 개장·자동종료)은 여기와 무관 — 특별일엔 사용자가 직접 바꾼다.
# 형식 "HH:MM" [개장, 마감]. 마감 ≤ 개장이면 익일 마감(야간). null = 그 시장 없음.
# 일곱 시장과 fx_calc_start는 필수 — 코드에 기본 시각이 없어 빠지면 시동 ConfigError. 값은 사용자가 관리.
market_hours:
  krx:           ["09:00", "15:30"]   # KRX 정규장
  nxt_pre:       ["08:00", "08:50"]   # NXT 프리마켓
  nxt_main:      ["09:00", "15:20"]   # NXT 메인마켓
  nxt_after:     ["15:30", "20:00"]   # NXT 애프터마켓
  stock_futures: ["08:45", "15:45"]   # 주식선물(주식·금리 파생)
  fx_futures:    ["08:45", "15:45"]   # 원달러선물 주간(통화상품)
  fx_night:      ["18:00", "06:00"]   # 야간 원달러선물(익일 06:00)
fx_calc_start: "07:30"               # 환율 계산 시작(exec 결정 47) — 이 전엔 판정·정산용 환율 없음

# 특별 개장일 — 바뀌는 날만 적는다. 적은 시장만 위를 덮고, null = 그날 열지 않음.
# 그날 메인 시동 때 "특별 개장일" 팝업 + 코어 로그 한 줄. 날짜가 지나면 저절로 평소.
special_days:
  "2026-11-19":                       # 수능일 — KRX 2026-11-05 발표(기사), NXT 프리마켓 휴장
    name: 수능일
    krx:           ["10:00", "16:30"]
    nxt_pre:       null
    nxt_main:      ["10:00", "16:20"]
    nxt_after:     ["17:00", "20:00"]  # 기사 기준 초기값
    stock_futures: ["09:45", "16:45"]
    fx_futures:    ["09:45", "15:45"]  # 개장만 늦고 마감은 그대로
    fx_night:      ["19:00", "06:00"]
